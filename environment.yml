# Minimal conda environment for the BOSS BC baselines.
#
# The previous version of this file was a full `conda env export` of a machine
# that also had OpenVLA and other projects installed. Its pip section could not
# be resolved -- it pinned protobuf==3.20.3 and tensorboard==2.18.0 alongside an
# unpinned `tensorflow`, which pip resolves to 2.8.x, and that requires
# protobuf<3.20 and tensorboard<2.9.
name: boss
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - -r requirements.txt
